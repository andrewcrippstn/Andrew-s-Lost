<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andrew’s Lost</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0f1115;--s1:#171a20;--s2:#1c2029;--bd:#2a2f3a;--tx:#e7eaf0;--mu:#8a93a6;--ac:#5b8cff;--oa:#111111;--hl:#ff9f1a;--ok:#22a06b;--wn:#d98a0b;--er:#e5484d;
--acs:color-mix(in srgb,var(--ac) 16%,var(--s1));--hv:color-mix(in srgb,var(--tx) 8%,transparent);--r:6px;--pad:8px;--fs:14px;--dur:.15s;--pw:300px;--iw:300px;--rw:62px}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
:root.nomo{--dur:0s}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{position:relative;height:100%;display:grid;grid-template-rows:46px minmax(0,1fr) 32px;grid-template-columns:var(--rw) var(--pw) minmax(0,1fr) var(--iw);transition:grid-template-columns .22s cubic-bezier(.2,.8,.3,1)}
#top,#status{grid-column:1/-1}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--s1);border-bottom:1px solid var(--bd);z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:6px;white-space:nowrap}
.brand i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 45%,#8b5cf6));color:#fff;display:grid;place-items:center}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:var(--s2);padding:calc(var(--pad)*.6) calc(var(--pad)*1.4);border-radius:var(--r);cursor:pointer;transition:background var(--dur),border-color var(--dur)}
.btn:hover{background:var(--hv);border-color:var(--mu)}
.btn.pri{background:var(--ac);color:var(--oa);border-color:var(--ac)}.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{color:var(--er);border-color:color-mix(in srgb,var(--er) 50%,var(--bd))}
.btn.ghost{background:transparent;border-color:transparent}
.btn[aria-pressed=true]{background:var(--ac);color:var(--oa);border-color:var(--ac)}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:32px;height:32px;padding:0}
.strig{display:flex;align-items:center;gap:8px;min-width:min(300px,32vw);border:1px solid var(--bd);background:var(--bg);color:var(--mu);padding:6px 10px;border-radius:var(--r);cursor:pointer}
.strig span{flex:1;text-align:left}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--bd);border-radius:4px;padding:0 5px;color:var(--mu)}
#rail{position:relative;z-index:25;background:var(--s1);border-right:1px solid var(--bd)}
.rin{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px 0 8px;overflow:hidden;}
#app:has(#rail:hover),#app:has(#rail :focus-visible){--rw:180px}
#app.rp #rail .rin{box-shadow:none}
.rlab{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mu);padding:0 16px 8px;white-space:nowrap;opacity:0;transition:opacity .15s .05s}
.mr{display:flex;flex-direction:column;gap:2px;padding:0 8px}.mr.f{flex:1}
.mode-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:calc(var(--r)*1.4);background:transparent;color:var(--mu);font-weight:500;cursor:pointer;position:relative;text-align:left;width:100%;white-space:nowrap;transition:background var(--dur),color var(--dur)}
.mode-btn svg{flex:none}.mode-btn:hover{background:var(--hv);color:var(--tx)}
.mode-btn[aria-current=true]{background:var(--acs);color:var(--tx);font-weight:600}
.mode-btn[aria-current=true]::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:22px;border-radius:2px;background:var(--ac)}
.mode-btn[aria-pressed=true]{color:var(--ac)}
.mode-label{opacity:0;max-width:0;overflow:hidden;transition:opacity .15s,max-width .25s}
#rail:hover .rlab,#rail:has(:focus-visible) .rlab,#app.rp .rlab{opacity:1}
#rail:hover .mode-label,#rail:has(:focus-visible) .mode-label,#app.rp .mode-label{opacity:1;max-width:140px}
#panel,#insp{background:var(--s1);overflow:auto;min-height:0;min-width:0}
#panel{background:var(--s2);border-right:1px solid var(--bd)}#insp{border-left:1px solid var(--bd)}
#app.nop{--pw:0px}#app.rp{--rw:180px}#app.nop #panel{visibility:hidden;border:0}#app:not(.hasins){--iw:0px}#app:not(.hasins) #insp{visibility:hidden;border:0}
.ph{padding:14px 16px 12px;border-bottom:1px solid var(--bd);margin-bottom:10px}.ph h2{margin:0;font-size:1.1em}.ph p{margin:2px 0 0;color:var(--mu);font-size:.9em}
.pb{padding:0 12px 14px;display:flex;flex-direction:column;gap:8px}
.gh{font-size:.75em;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:8px 2px 0;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:var(--pad) 10px;border-radius:var(--r);border:1px solid transparent;cursor:pointer}
.row:hover{background:var(--hv)}.row[aria-selected=true],.row.act{background:var(--acs);border-color:var(--ac)}
.row .ri{color:var(--mu);flex:none;display:flex}.row .rt{flex:1;min-width:0}
.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}
.tag{font-size:.72em;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;color:var(--mu);flex:none}.tag.w{color:var(--wn);border-color:var(--wn)}
textarea{resize:vertical}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:calc(var(--pad)*.7) var(--pad);min-width:0;width:100%}
input[type=color]{padding:2px;height:34px;width:48px}input[type=checkbox]{width:18px;height:18px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:.85em;color:var(--mu)}.fld input{font-size:1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .w{grid-column:1/-1}
.err{color:var(--er);font-size:.85em;min-height:1em}.hint{color:var(--mu);font-size:.88em;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92em}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer}.seg button+button{border-left:1px solid var(--bd)}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--oa)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:transparent;border-radius:99px;padding:3px 11px;cursor:pointer;font-size:.85em}
.chip[aria-pressed=true]{background:var(--acs);border-color:var(--ac);color:var(--ac)}
.doc{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg)}
.doc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc small{color:var(--mu)}
.doc .chips{flex-wrap:nowrap;align-items:center}.doc .chips .btn{padding:3px 9px}
#ws{position:relative;min-width:0;min-height:0;overflow:hidden}
#viewer{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--bg) 85%,var(--tx)) 0%,var(--bg) 62%)}
#viewer.draw{cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none}
.pg{position:absolute;left:0;width:100%;background:#fff;box-shadow:0 4px 24px #0005}.pg canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;pointer-events:none}
.room{position:absolute}
.room.hl{background:color-mix(in srgb,var(--hl) 35%,transparent);border:calc(3px*var(--iz)) solid var(--hl);box-shadow:0 0 0 calc(2px*var(--iz)) #fff8}
.room.adm{border:calc(2px*var(--iz)) dashed var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent);pointer-events:auto;cursor:move}
.room.nm{border:calc(2px*var(--iz)) solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.room.sel{border-style:solid;border-color:var(--hl);background:color-mix(in srgb,var(--hl) 30%,transparent)}
.room span{position:absolute;left:0;bottom:100%;white-space:nowrap;background:#1d2330;color:#fff;font-size:calc(13px*var(--iz));padding:calc(2px*var(--iz)) calc(7px*var(--iz));border-radius:calc(4px*var(--iz));font-weight:600}
.room span,.pin span{translate:calc(var(--dx,0)*var(--iz)*1px) calc(var(--dy,0)*var(--iz)*1px)}
.hd{position:absolute;width:calc(14px*var(--iz));height:calc(14px*var(--iz));background:var(--hl);border:calc(2px*var(--iz)) solid #fff;border-radius:50%;pointer-events:auto}
.hd[data-h=nw]{left:calc(-7px*var(--iz));top:calc(-7px*var(--iz));cursor:nwse-resize}.hd[data-h=ne]{right:calc(-7px*var(--iz));top:calc(-7px*var(--iz));cursor:nesw-resize}
.hd[data-h=sw]{left:calc(-7px*var(--iz));bottom:calc(-7px*var(--iz));cursor:nesw-resize}.hd[data-h=se]{right:calc(-7px*var(--iz));bottom:calc(-7px*var(--iz));cursor:nwse-resize}
.pin{position:absolute;width:calc(26px*var(--iz));height:calc(26px*var(--iz));margin:calc(-13px*var(--iz)) 0 0 calc(-13px*var(--iz));border-radius:50%;background:var(--ac);color:var(--oa);border:calc(2px*var(--iz)) solid #fff;box-shadow:0 1px 5px #0007;display:grid;place-items:center;font-size:calc(11px*var(--iz));font-weight:700;pointer-events:auto;cursor:pointer}
.pin.hl,.pin.sel{background:var(--hl);color:#111;z-index:2;box-shadow:0 0 0 calc(4px*var(--iz)) color-mix(in srgb,var(--hl) 40%,transparent)}
.pin span{position:absolute;left:50%;bottom:calc(100% + 4px*var(--iz));transform:translateX(-50%);white-space:nowrap;background:#1d2330;color:#fff;font-size:calc(13px*var(--iz));padding:calc(2px*var(--iz)) calc(7px*var(--iz));border-radius:calc(4px*var(--iz))}
#draft{position:absolute;border:calc(2px*var(--iz)) solid var(--ac);background:color-mix(in srgb,var(--ac) 25%,transparent)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--mu);padding:20px}
#status{display:flex;align-items:center;gap:12px;padding:0 10px;background:var(--s1);border-top:1px solid var(--bd);font-size:.85em;color:var(--mu);z-index:30;white-space:nowrap;overflow:hidden}
#status .tn{font-variant-numeric:tabular-nums}#sSel{overflow:hidden;text-overflow:ellipsis}
#sDoc{max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
#status .btn{padding:2px 8px;font-size:1em}.pill{padding:2px 9px;border-radius:6px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);font-weight:600}.grp{display:flex;align-items:center;gap:2px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:1px 3px}.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
#menu{position:fixed;z-index:50;min-width:230px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 10px 30px #0006;padding:4px}
#menu button{display:flex;width:100%;justify-content:space-between;gap:20px;border:0;background:transparent;padding:7px 10px;border-radius:calc(var(--r)*.7);cursor:pointer;text-align:left}#menu button:hover{background:var(--hv)}
#pal{position:fixed;inset:0;z-index:60;background:#0009;display:flex;justify-content:center;align-items:flex-start;padding:max(9vh,env(safe-area-inset-top)) 12px 12px}
.pp{width:min(660px,100%);background:var(--s1);border:1px solid var(--bd);border-radius:calc(var(--r)*2);box-shadow:0 24px 70px #000a;display:flex;flex-direction:column;max-height:72vh;overflow:hidden}
.pi{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--bd);height:54px;color:var(--mu)}
.pi input{border:0;background:transparent;font-size:1.1rem;padding:0;outline:none}
.pc{display:flex;gap:6px;padding:8px 12px 0}
#pl{overflow:auto;padding:6px 8px;min-height:60px}
.pf{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--bd);color:var(--mu);font-size:.8em;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
dialog{border:1px solid var(--bd);border-radius:calc(var(--r)*2);background:var(--s1);color:var(--tx);padding:0;box-shadow:0 24px 70px #000a;max-width:96vw}
dialog::backdrop{background:#0009}
dialog[open]{display:flex;flex-direction:column}
#set{width:min(920px,96vw);height:min(680px,92vh)}#io{width:min(580px,94vw)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd)}.sh h2{margin:0;font-size:1.1em}
.sb{display:grid;grid-template-columns:190px minmax(0,1fr);flex:1;min-height:0}
.sn{border-right:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sn button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--mu)}
.sn button:hover{background:var(--hv)}.sn button[aria-current=true]{background:var(--acs);color:var(--ac);font-weight:600}
.sc{overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}.sc h3{margin:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--bd)}.srow small{display:block;color:var(--mu)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;max-height:340px;overflow:auto;padding:3px}
.tc{border:1px solid var(--bd);border-radius:calc(var(--r)*1.5);padding:6px;background:var(--s2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tc:hover{border-color:var(--mu)}.tc[aria-pressed=true]{outline:2px solid var(--ac);border-color:var(--ac)}
.tc b{font-size:.9em}.tc small{color:var(--mu);font-size:.75em}
.pv{height:60px;border-radius:var(--r);padding:7px;display:flex}
.pv i{flex:1;border:1px solid;border-radius:5px;padding:5px;display:flex;flex-direction:column;gap:4px}
.pv b{height:5px;border-radius:3px;display:block}.pv u{height:9px;width:38px;border-radius:3px;margin-top:auto}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.sw button[aria-pressed=true]{outline:2px solid var(--tx);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(50px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);box-shadow:0 8px 24px #0006;padding:8px 14px;border-radius:var(--r);z-index:80;max-width:90vw}
@media (max-width:900px){
 #app{grid-template-columns:48px minmax(0,1fr)}
 #panel,#insp{position:absolute;top:46px;bottom:32px;z-index:20;width:min(340px,88vw);box-shadow:0 0 30px #0007;transition:transform var(--dur)}
 #panel{left:48px;transform:translateX(-130%)}#insp{right:0;transform:translateX(130%)}
 #app.pop #panel,#app.iop #insp{transform:none}
 #app.nop #panel{visibility:visible}
 .strig{min-width:0}.strig kbd,.hn{display:none}
 .sb{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sn{flex-direction:row;border-right:0;border-bottom:1px solid var(--bd)}
}
</style>
</head>
<body>
<div id="app">
<header id="top">
  <div class="brand"><i id="logo"></i><span class="hn">Andrew’s Lost</span></div>
  <button class="btn ghost" data-menu="File">File</button><button class="btn ghost" data-menu="View">View</button><button class="btn ghost" data-menu="Tools">Tools</button><button class="btn ghost" data-menu="Help">Help</button>
  <span class="sp"></span>
  <button class="strig" id="sbtn" aria-label="Search rooms and people"><span id="sbl">Search rooms and people…</span><kbd>Ctrl K</kbd></button>
  <button class="btn ghost ib" id="bSet" aria-label="Settings" title="Settings (Ctrl ,)"></button>
</header>
<nav id="rail" aria-label="Modes"></nav>
<aside id="panel" aria-label="Tools"></aside>
<main id="ws">
  <div id="viewer"><div id="stage"></div></div>
  <div id="empty"><b>No floor plans loaded</b><span>Load one or more PDFs of your office floor plans.</span><label class="btn pri" id="emptyBtn">Load floor plan PDFs</label></div>
</main>
<aside id="insp" aria-label="Details"></aside>
<footer id="status">
  <span class="dot"></span><span class="pill" id="sMode"></span><span id="sSel" class="sp"></span><span id="sCur" class="tn hn"></span><span id="sDoc" class="hn"></span>
  <div class="grp"><button class="btn ghost" id="sPrev" aria-label="Previous page">‹</button><span id="sPg" class="tn"></span><button class="btn ghost" id="sNext" aria-label="Next page">›</button></div>
  <div class="grp"><button class="btn ghost" id="zo" aria-label="Zoom out">−</button><span id="sZ" class="tn"></span><button class="btn ghost" id="zi" aria-label="Zoom in">+</button><button class="btn ghost" id="zf" aria-label="Fit to screen" title="Fit to screen"></button></div>
</footer>
</div>
<div id="menu" hidden role="menu"></div>
<div id="pal" hidden>
  <div class="pp" role="dialog" aria-modal="true" aria-label="Search">
    <div class="pi"><span id="pIc"></span>
      <input id="pq" type="text" role="combobox" aria-expanded="true" aria-controls="pl" aria-autocomplete="list" placeholder="Search rooms, people and actions…" autocomplete="off" aria-label="Search">
      <button class="btn ghost ib" id="pX" aria-label="Close search"></button></div>
    <div class="pc" id="pc"></div>
    <div id="pl" role="listbox" aria-label="Results"></div>
    <div class="sr" id="pst" aria-live="polite"></div>
    <div class="pf"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> highlight all</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<dialog id="set" aria-labelledby="setT"><div class="sh"><h2 id="setT">Settings</h2><button class="btn ghost ib" id="setX" aria-label="Close settings"></button></div><div class="sb"><nav class="sn" id="sn" aria-label="Settings categories"></nav><div class="sc" id="sc"></div></div></dialog>
<dialog id="io" aria-labelledby="ioT"><div class="sh"><h2 id="ioT"></h2><button class="btn ghost ib" id="ioX" aria-label="Close"></button></div>
  <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><textarea id="ioTa" rows="11" style="font:12px ui-monospace,monospace"></textarea>
  <div class="chips"><label class="btn" id="ioFL">Choose file<input id="ioF" type="file" accept=".json,.csv,text/csv,application/json" hidden></label><button class="btn pri" id="ioGo"></button><button class="btn" id="ioCp">Copy</button></div>
  <p class="hint" id="ioMsg"></p></div></dialog>
<div id="toast" role="status" hidden></div>
<input type="file" id="pdfIn" accept="application/pdf" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
/* ===== Room Finder =====
 * Several PDFs can be loaded. They are treated as one continuous run of pages, in the order listed under Data:
 * PDF 1 pages first, then PDF 2, and so on. PAGE NUMBERS ARE 1-BASED and global across all PDFs.
 * Reordering or removing a PDF renumbers rooms and people automatically.
 *   room   {id,name,floor,page,x,y,width,height,capacity,equipment[]}
 *   person {id,name,role,team,contact,page,x,y}   (x,y = seat position; null until placed)
 * Storage: IndexedDB "roomfinder" (rooms, people, pdfs [{name,buf}]; legacy single "pdf" is migrated); localStorage "mrf-settings". */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* Reorder / remove PDFs. `order` lists the old doc indexes in their new order; omitted ones are removed.

  const map={};let ng=0;order.forEach(oi=>{for(let p=1;p<=docs[oi].n;p++)map[starts[oi]+p]=++ng});
  let lostR=0,lostP=0;

  people.forEach(p=>{const m=map[p.page];if(m)p.page=m;else{if(p.x!=null)lostP++;p.x=p.y=null;p.page=1}});
  docs=order.map(i=>docs[i]);

    let pick=c.find(([dx,dy])=>{const r={left:it.r.left+dx,right:it.r.right+dx,top:it.r.top+dy,bottom:it.r.bottom+dy};return!placed.some(p=>hit(r,p))})||[0,0];
    placed.push({left:it.r.left+pick[0],right:it.r.right+pick[0],top:it.r.top+pick[1],bottom:it.r.bottom+pick[1]});
    it.s.style.setProperty('--dx',pick[0]);it.s.style.setProperty('--dy',pick[1])}
}

/* ---------- Pointer interaction: pan, pinch, draw, move, resize, place, drag pins ---------- */
const ptrs=new Map();let drag=null,pinch=null;
function relPos(e,pn){let best=null,bd=1e12;
  for(const d of stage.querySelectorAll('.pg')){if(pn&&+d.dataset.p!==pn)continue;const r=d.getBoundingClientRect(),dy=e.clientY<r.top?r.top-e.clientY:e.clientY>r.bottom?e.clientY-r.bottom:0;if(dy<bd){bd=dy;best={n:+d.dataset.p,r}}}
  if(!best)return{x:0,y:0,p:page,out:true};const r=best.r;
  return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1),p:best.n,out:bd>0||e.clientX<r.left||e.clientX>r.right}}
viewer.addEventListener('pointerdown',e=>{
  viewer.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){drag=null;draft=null;const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};return}
  if(!pdf)return;
  if(tool==='place'){placeAt(relPos(e));return}
  if(tool==='person'){addPersonAt(relPos(e));return}
  if(isEd()&&tool==='draw'){const p=relPos(e);drag={t:'draw',x0:p.x,y0:p.y,p:p.p};draft={p:p.p,x:p.x,y:p.y,w:0,h:0};return}
  const pin=e.target.closest('.pin'),hd=e.target.closest('.hd'),rm=e.target.closest('.room.adm');
  if(pin){const o=people.find(p=>p.id===pin.dataset.id);select('person',o.id,false);hl=new Set(['p:'+o.id]);drawOverlay();if(isEd())drag={t:'pin',o};return}
  if(isEd()&&hd){drag={t:'resize',k:hd.dataset.h,r:obj(sel)};return}
  if(isEd()&&rm){const r=rooms.find(x=>x.id===rm.dataset.id),p=relPos(e,r.page);select('room',r.id,false);drag={t:'move',r,dx:p.x-r.x,dy:p.y-r.y};return}
  drag={t:'pan',x:e.clientX,y:e.clientY};
});
viewer.addEventListener('pointermove',e=>{
  if(pdf){const q=relPos(e);$('#sCur').textContent=q.out?'':`p${q.p}  x ${q.x.toFixed(3)}  y ${q.y.toFixed(3)}`}
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),rc=viewer.getBoundingClientRect();zoomAt(d/pinch.d,(a.x+b.x)/2-rc.left,(a.y+b.y)/2-rc.top);pinch.d=d;return}
  if(!drag)return;
  if(drag.t==='pan'){tx+=e.clientX-drag.x;ty+=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;apply()}
  else if(drag.t==='draw'){const p=relPos(e,drag.p);draft={p:drag.p,x:Math.min(drag.x0,p.x),y:Math.min(drag.y0,p.y),w:Math.abs(p.x-drag.x0),h:Math.abs(p.y-drag.y0)};drawOverlay()}
  else if(drag.t==='move'){const r=drag.r,p=relPos(e,r.page);r.x=clamp(p.x-drag.dx,0,1-r.width);r.y=clamp(p.y-drag.dy,0,1-r.height);drawOverlay()}
  else if(drag.t==='pin'){const p=relPos(e);drag.o.x=p.x;drag.o.y=p.y;drag.o.page=p.p;drawOverlay()}
  else if(drag.t==='resize'){const r=drag.r,p=relPos(e,r.page),k=drag.k,R=r.x+r.width,B=r.y+r.height,m=.005;
    if(k.includes('w')){r.x=Math.min(p.x,R-m);r.width=R-r.x}else r.width=Math.max(m,p.x-r.x);
    if(k.includes('n')){r.y=Math.min(p.y,B-m);r.height=B-r.y}else r.height=Math.max(m,p.y-r.y);drawOverlay()}
});
function endPtr(e){
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(drag&&drag.t==='draw'){const d=draft;draft=null;
    if(d&&d.w>.005&&d.h>.005){const rid=nextId(rooms,'MR'),r={id:rid,name:'New room '+parseInt(rid.slice(2)),floor:'',page:d.p,x:d.x,y:d.y,width:d.w,height:d.h,notes:''};
      rooms.push(r);saveRooms();tool=null;select('room',r.id,false);setTimeout(()=>$('#insp [data-f=name]')?.select(),0)}else{drawOverlay()}}
  else if(drag&&(drag.t==='move'||drag.t==='resize')){saveRooms();renderInsp()}
  else if(drag&&drag.t==='pin'){savePeople();renderInsp();renderList()}
  if(!ptrs.size)drag=null;

viewer.addEventListener('pointerup',endPtr);viewer.addEventListener('pointercancel',endPtr);
viewer.addEventListener('wheel',e=>{e.preventDefault();const rc=viewer.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-rc.left,e.clientY-rc.top)},{passive:false});

/* ---------- Search (ranked, tokenised) ---------- */
function score(q,f){const t=q.toLowerCase().split(/\s+/).filter(Boolean);if(!t.length)return 1;const[a,...rest]=f.map(x=>String(x||'').toLowerCase());let tot=0;
  for(const w of t){let s=0;if(a===w)s=100;else if(a.startsWith(w))s=80;else if(a.split(/[\s\-_.]+/).some(x=>x.startsWith(w)))s=65;else if(a.includes(w))s=50;else if((rest[0]||'').includes(w))s=30;else if(rest.join(' ').includes(w))s=15;else return 0;tot+=s}return tot/t.length}
function search(q,scope){const out=[],wr=scope==='room'||scope==='both'||(scope==='all'&&S.sr),wp=scope==='person'||scope==='both'||(scope==='all'&&S.sp);
  if(wr)for(const o of rooms){const s=score(q,[o.name,o.notes||'',o.id]);if(s)out.push({k:'room',o,s})}
  if(wp)for(const o of people){const s=score(q,[o.name,[o.role,o.team,o.contact].join(' '),o.id]);if(s)out.push({k:'person',o,s})}
  return out.sort((a,b)=>b.s-a.s||a.o.name.localeCompare(b.o.name))}

}

  const i=e.target.closest('#menu [data-i]');if(i){closeMenu();menuItems[+i.dataset.i][2]();return}if(!e.target.closest('#menu'))closeMenu()});
$('#pdfIn').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;toast('Reading '+fs.length+' PDF'+(fs.length>1?'s':'')+'…');try{await addPdfs(fs)}catch(err){toast('Could not read that PDF')}};
$('#emptyBtn').htmlFor='pdfIn';

/* ---------- Command palette (global search) ---------- */
const P={open:false,i:0,items:[],scope:'all',from:null};
const CMDS=()=>[{n:'Open settings',f:()=>openSet()},{n:'Fit floor plan to screen',f:fitView},{n:'Back to page 1',f:home}];
function openPal(){if(P.open){$('#pq').select();return}if(document.querySelector('dialog[open]'))return;P.open=true;P.from=document.activeElement;$('#pal').hidden=false;$('#pq').value='';renderPal();$('#pq').focus()}
function closePal(){if(!P.open)return;P.open=false;$('#pal').hidden=true;P.from&&P.from.focus&&P.from.focus()}
function renderPal(){
  const q=$('#pq').value.trim(),sc=P.scope;let it=[];
  if(q){const res=search(q,sc);res.filter(x=>x.k==='room').forEach(x=>it.push({g:'Rooms',...x}));res.filter(x=>x.k==='person').forEach(x=>it.push({g:'People',...x}));
    if(sc==='all')CMDS().filter(c=>c.n.toLowerCase().includes(q.toLowerCase())).forEach(c=>it.push({g:'Actions',c}))}
  else{S.recent.forEach(k=>{const o=(k[0]==='r'?rooms:people).find(x=>x.id===k.slice(2));if(o)it.push({g:'Recent',k:k[0]==='r'?'room':'person',o})});if(sc==='all')CMDS().forEach(c=>it.push({g:'Actions',c}))}
  it=it.slice(0,60);P.items=it;P.i=0;let h='',g='';
  it.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="gh" role="presentation">${g}</div>`}
    const main=x.c?x.c.n:x.o.name,sub=x.c?'':x.k==='room'?(x.o.notes||'').split('\n')[0]:[x.o.role,x.o.team].filter(Boolean).join(' · ')||x.o.id;
    const tag=x.c?'Action':x.k==='room'?'Room':x.o.x==null?'Not placed':'Person';
    h+=`<div class="row" role="option" id="po${i}" data-i="${i}" aria-selected="false"><span class="ri">${ic(x.c?'cmd':x.k==='room'?'room':'user')}</span><span class="rt"><b>${esc(main)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span><span class="tag${tag==='Not placed'?' w':''}">${tag}</span></div>`});
  $('#pl').innerHTML=h||`<p class="hint" style="padding:12px">${q?'No matches for “'+esc(q)+'”. Try a room number, a name, or a different scope.':'Nothing to search yet. Use Rooms and People in the left menu to add some.'}</p>`;
  $('#pc').innerHTML=[['all','All'],['room','Rooms'],['person','People']].map(s=>`<button class="chip" data-sc="${s[0]}" aria-pressed="${P.scope===s[0]}">${s[1]}</button>`).join('');
  $('#pst').textContent=it.length?it.length+' results':'No results';palSel(0);
}
function palSel(i){P.i=clamp(i,0,Math.max(0,P.items.length-1));[...$('#pl').querySelectorAll('.row')].forEach(r=>r.setAttribute('aria-selected',+r.dataset.i===P.i));
  const r=$('#po'+P.i);$('#pq').setAttribute('aria-activedescendant',r?r.id:'');r&&r.scrollIntoView({block:'nearest'})}
async function palGo(i,all){const x=P.items[i];if(!x)return;
  if(x.c){closePal();x.c.f();return}
  const list=all?P.items.filter(y=>!y.c):[x];closePal();
  S.recent=[key(x.k,x.o.id),...S.recent.filter(k=>k!==key(x.k,x.o.id))].slice(0,6);saveS();
  const same=list.filter(y=>y.o.page===x.o.page&&(y.k==='room'||y.o.x!=null)).map(y=>rectOf(y.k,y.o));
  const rect=same.length>1?[Math.min(...same.map(r=>r[0])),Math.min(...same.map(r=>r[1])),Math.max(...same.map(r=>r[2])),Math.max(...same.map(r=>r[3]))]:null;
  select(x.k,x.o.id,true,{hl:list.map(y=>key(y.k,y.o.id)),rect})}
$('#sbtn').onclick=openPal;$('#pX').onclick=closePal;$('#pIc').innerHTML=ic('search');
$('#pq').addEventListener('input',renderPal);
$('#pq').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel(P.i+1)}else if(e.key==='ArrowUp'){e.preventDefault();palSel(P.i-1)}
  else if(e.key==='Enter'){e.preventDefault();palGo(P.i,e.shiftKey)}});
$('#pl').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)palGo(+r.dataset.i,false)});
$('#pl').addEventListener('mousemove',e=>{const r=e.target.closest('.row');if(r&&+r.dataset.i!==P.i)palSel(+r.dataset.i)});
$('#pc').addEventListener('click',e=>{const s=e.target.closest('[data-sc]');if(s){P.scope=s.dataset.sc;renderPal();$('#pq').focus()}});
$('#pal').addEventListener('mousedown',e=>{if(e.target.id==='pal')closePal()});

/* ---------- Settings dialog ---------- */
let setCat='appearance',tq='',tf='All',cb=null;
const CATS=[['appearance','Appearance'],['plan','Floor plan'],['search','Search & map'],['data','Data & storage'],['about','About & shortcuts']];
const seg=(k,o)=>`<div class="seg" role="group">${o.map(x=>`<button data-set="${k}" data-val="${x[0]}" aria-pressed="${S[k]===x[0]}">${x[1]}</button>`).join('')}</div>`;
const srow=(l,h,c)=>`<div class="srow"><div><b>${l}</b><small>${h||''}</small></div>${c}</div>`;
const tog=(k,l,h)=>`<label class="srow"><div><b>${l}</b><small>${h}</small></div><input type="checkbox" data-set="${k}" ${S[k]?'checked':''}></label>`;
const prev=p=>`<div class="pv" style="background:${p[0]}"><i style="background:${p[1]};border-color:${p[3]}"><b style="background:${p[4]};width:70%"></b><b style="background:${p[5]};width:45%"></b><u style="background:${p[6]}"></u></i></div>`;
function openSet(c){if(c)setCat=c;renderSet();if(!$('#set').open)$('#set').showModal()}
function renderSet(){
  const sc=$('#sc'),top=sc.scrollTop;$('#sn').innerHTML=CATS.map(c=>`<button data-cat="${c[0]}" aria-current="${setCat===c[0]}">${c[1]}</button>`).join('');let h='';
  if(setCat==='appearance'){const cu=S.custom;
    h=`<h3>Appearance</h3><p class="hint">Changes apply immediately and are saved on this device.</p>`+srow('Mode','Light, dark, or follow your system.',seg('mode',[['light','Light'],['dark','Dark'],['system','System']]))+
    `<div class="gh">Theme · <span id="tcount"></span></div><input id="tq" type="search" placeholder="Search themes…" aria-label="Search themes" value="${esc(tq)}"><div class="chips">${['All',...Object.keys(FAM),CR,'Custom'].map(f=>`<button class="chip" data-tf="${esc(f)}" aria-pressed="${tf===f}">${esc(f)}</button>`).join('')}</div><div class="gal" id="gal"></div>`+
    `<div class="gh">Accent colour</div><div class="sw">${ACC.map(a=>`<button data-acc="${a[1]}" style="background:${a[1]}" aria-label="${a[0]}" title="${a[0]}" aria-pressed="${S.accent===a[1]}"></button>`).join('')}<input type="color" id="accIn" aria-label="Custom accent colour" value="${S.accent||palOf(curTh(),isDark())[6]}"><button class="btn" data-act="accReset">Use theme accent</button></div>`+
    srow('Density','Spacing of controls and lists.',seg('density',[['compact','Compact'],['comfortable','Comfortable'],['spacious','Spacious']]))+
    srow('Corners','','<div></div>').replace('<div></div>',seg('radius',[['sharp','Sharp'],['subtle','Subtle'],['rounded','Rounded'],['pill','Pill']]))+
    srow('Text size','',seg('text',[['small','Small'],['default','Default'],['large','Large'],['xl','Extra large']]))+
    srow('Motion','Turn off transitions.',seg('motion',[['system','System'],['reduced','Reduced'],['off','Off']]))+
    `<div class="gh">Custom theme</div>`+(()=>{if(!cb){const p=palOf(curTh(),isDark());cb={n:'My theme',bg:p[0],s1:p[1],bd:p[3],tx:p[4],ac:p[6]}}
      const f=(l,k)=>`<label class="fld">${l}<input type="color" data-cb="${k}" value="${cb[k]}"></label>`;
      return `<div class="g2"><label class="fld w">Name<input data-cb="n" value="${esc(cb.n)}"></label></div><div class="sw">${f('Background','bg')}${f('Surface','s1')}${f('Border','bd')}${f('Text','tx')}${f('Accent','ac')}</div><div id="cbp"></div><div class="err" id="cbw"></div><div class="chips"><button class="btn pri" data-act="saveCustom">Save as new theme</button></div>`+
        (cu.length?`<div class="gh">Your themes</div>`+cu.map(c=>`<div class="srow"><span>${esc(c.n)}</span><button class="btn dng" data-act="delCustom" data-id="${c.id}">Delete</button></div>`).join(''):'')})()}
  else if(setCat==='plan')h=`<h3>Floor plan</h3><p class="hint">How pages are shown, and where the view goes when you open a room or person. Several PDFs are shown as one continuous run of pages.</p>`+srow('Page layout','Stacked pages scroll as one long plan.',seg('view',[['stack','Stacked vertically'],['single','One page at a time']]))+srow('Zoom when jumping to a room or person','Applies when you pick a search result or click an item in a list.',seg('fz',[['fit','Fit the item'],['fixed','Fixed zoom']]))+(S.fz==='fixed'?srow('Zoom level','Percent of the “fit page” zoom shown in the status bar.',`<div style="display:flex;gap:10px;align-items:center;width:240px"><input type="range" min="100" max="800" step="25" value="${S.fzv}" data-range="fzv" aria-label="Zoom level"><span id="fzl">${S.fzv}%</span></div>`):'');
  else if(setCat==='search')h=`<h3>Search & map</h3><p class="hint">Control what global search (Ctrl K) covers and what the plan shows.</p>`+tog('people','Show people on the map','Display seat markers for everyone who has been placed.')+tog('nameRooms','Always show room names','Outline every room on the plan with its name, not just search results.')+tog('namePeople','Always show people’s names','Keep every person’s name visible beside their marker.')+tog('sr','Search rooms','Include rooms in global search.')+tog('sp','Search people','Include people in global search.')+srow('Recent searches',S.recent.length+' saved on this device','<button class="btn" data-act="clearRecent">Clear</button>');
  else if(setCat==='data')h=`<h3>Data & storage</h3><p class="hint">Rooms, people and the PDFs are stored in this browser only. Add, reorder or remove PDFs from Data in the left menu.</p><dl class="kv"><dt>PDFs</dt><dd>${pdfInfo()}</dd><dt>Rooms</dt><dd>${rooms.length}</dd><dt>People</dt><dd>${people.length}</dd></dl><div class="chips"><button class="btn" data-act="exp">Export…</button><button class="btn" data-act="imp">Import…</button></div><div class="gh">Danger zone</div>`+srow('Delete all rooms and people','Cannot be undone. Export first.','<button class="btn dng" data-act="wipe">Delete</button>')+srow('Reset settings','Restore the default theme and preferences.','<button class="btn dng" data-act="resetS">Reset</button>');
  else h=`<h3>About & shortcuts</h3><p class="hint">Andrew’s Lost · version 3. Page numbers are 1-based and continuous across all loaded PDFs; positions are stored as 0–1 fractions of each page.</p><dl class="kv"><dt><kbd>Ctrl</kbd> <kbd>K</kbd> or <kbd>/</kbd></dt><dd>Open search</dd><dt><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></dt><dd>Move and open a result</dd><dt><kbd>Shift</kbd> <kbd>Enter</kbd></dt><dd>Highlight every result</dd><dt><kbd>Ctrl</kbd> <kbd>,</kbd></dt><dd>Settings</dd><dt><kbd>Esc</kbd></dt><dd>Close search or cancel placing/drawing</dd></dl>`;
  sc.innerHTML=h;sc.scrollTop=top;if(setCat==='appearance'){fillGal();cbPrev()}
}
function fillGal(){const d=isDark(),q=tq.toLowerCase(),L=allTh().filter(t=>(tf==='All'||t.f===tf)&&(!q||t.n.toLowerCase().includes(q)));
  $('#gal').innerHTML=L.map(t=>`<button class="tc" data-th="${t.id}" aria-pressed="${t.id===S.theme}">${prev(palOf(t,d))}<b>${esc(t.n)}${t.id===S.theme?' ✓':''}</b><small>${esc(t.f)}</small></button>`).join('')||'<p class="hint">No themes match.</p>';
  $('#tcount').textContent=L.length+' of '+allTh().length}
function cbPrev(){if(!cb)return;const mu=mixHex(cb.tx,cb.bg,.4);$('#cbp').innerHTML=`<div style="max-width:200px">${prev([cb.bg,cb.s1,cb.s1,cb.bd,cb.tx,mu,cb.ac])}</div>`;
  const w=[];if(contrast(cb.tx,cb.bg)<4.5)w.push('Text on background is hard to read ('+contrast(cb.tx,cb.bg).toFixed(1)+':1; aim for 4.5:1).');if(contrast(cb.tx,cb.s1)<4.5)w.push('Text on surface is hard to read.');$('#cbw').textContent=w.join(' ')}
function setS(k,v){S[k]=v;saveS();applyTheme();drawOverlay()}
$('#sn').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){setCat=b.dataset.cat;renderSet()}};
$('#sc').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.set){setS(t.dataset.set,t.dataset.val);if(t.dataset.set==='view')relayout();renderSet()}
  else if(t.dataset.th){setS('theme',t.dataset.th);renderSet()}
  else if(t.dataset.tf!==undefined){tf=t.dataset.tf;renderSet()}
  else if(t.dataset.acc){setS('accent',t.dataset.acc);renderSet()}
  else if(t.dataset.act==='accReset'){setS('accent',null);renderSet()}
  else if(t.dataset.act==='saveCustom'){const mu=mixHex(cb.tx,cb.bg,.4),tok=[cb.bg,cb.s1,cb.s1,cb.bd,cb.tx,mu,cb.ac],id='c-'+Date.now();S.custom.push({id,n:cb.n.trim()||'Custom theme',h:0,s:0,d:tok,l:tok});cb=null;setS('theme',id);toast('Theme saved');renderSet()}
  else if(t.dataset.act==='delCustom')arm(t,()=>{S.custom=S.custom.filter(c=>c.id!==t.dataset.id);if(S.theme===t.dataset.id)S.theme='ocean';saveS();applyTheme();renderSet()})
  else if(t.dataset.act==='clearRecent'){S.recent=[];saveS();renderSet()}
  else if(t.dataset.act==='exp'){$('#set').close();openIo('exp')}else if(t.dataset.act==='imp'){$('#set').close();openIo('imp')}
  else if(t.dataset.act==='wipe')arm(t,()=>{rooms=[];people=[];hl.clear();sel=null;saveRooms();savePeople();renderAll();renderSet();toast('Deleted')})
  else if(t.dataset.act==='resetS')arm(t,()=>{S={...DEF};saveS();applyTheme();cb=null;renderAll();renderSet()})});
$('#sc').addEventListener('input',e=>{const t=e.target;
  if(t.id==='tq'){tq=t.value;fillGal()}else if(t.id==='accIn')setS('accent',t.value);
  else if(t.dataset.cb){cb[t.dataset.cb]=t.value;cbPrev()}else if(t.dataset.range){S[t.dataset.range]=+t.value;saveS();$('#fzl').textContent=t.value+'%'}});
$('#sc').addEventListener('change',e=>{const t=e.target;if(t.type==='checkbox'&&t.dataset.set){setS(t.dataset.set,t.checked)}else if(t.id==='accIn')renderSet()});
$('#bSet').onclick=()=>openSet();$('#setX').onclick=()=>$('#set').close();$('#bSet').innerHTML=ic('set');$('#setX').innerHTML=ic('x');$('#ioX').innerHTML=ic('x');$('#pX').innerHTML=ic('x');$('#zf').innerHTML=ic('fit',16);
$('#logo').innerHTML=ic('pin',14);

/* ---------- Import / export / bulk add ---------- */
let ioMode='';
function csvParse(t){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);const hd=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  return rows.map(r=>Object.fromEntries(hd.map((h,i)=>[h,(r[i]||'').trim()])))}
const num=v=>v===''||v==null?NaN:Number(v);
function normRoom(o){const r={id:String(o.id||'').trim(),name:String(o.name||'').trim(),page:Math.max(1,parseInt(o.page)||1),x:num(o.x),y:num(o.y),width:num(o.width),height:num(o.height),notes:String(o.notes||'').trim()};
  if(!r.name||[r.x,r.y,r.width,r.height].some(isNaN))return null;for(const k of['x','y','width','height'])r[k]=clamp(r[k],0,1);return r}
function normPerson(o){const p={id:String(o.id||'').trim(),name:String(o.name||'').trim(),role:o.role||'',team:o.team||'',contact:o.contact||'',page:Math.max(1,parseInt(o.page)||1),x:num(o.x),y:num(o.y)};
  if(!p.name)return null;if(isNaN(p.x)||isNaN(p.y)){p.x=null;p.y=null}else{p.x=clamp(p.x,0,1);p.y=clamp(p.y,0,1)}return p}
function doImport(text){let rl=[],pl=[];text=text.trim();
  try{if(text[0]==='{'||text[0]==='['){const j=JSON.parse(text);if(Array.isArray(j))rl=j;else{rl=j.rooms||[];pl=j.people||[]}}else{const l=csvParse(text);if(l.length&&('width' in l[0]))rl=l;else pl=l}}catch(e){return 'Could not read that data: '+e.message}
  let a=0,bad=0;
  for(const o of rl){const r=normRoom(o);if(!r){bad++;continue}if(!r.id)r.id=nextId(rooms,'MR');const i=rooms.findIndex(x=>x.id===r.id);i>=0?rooms[i]=r:rooms.push(r);a++}
  for(const o of pl){const p=normPerson(o);if(!p){bad++;continue}if(!p.id)p.id=nextId(people,'P');const i=people.findIndex(x=>x.id===p.id);i>=0?people[i]=p:people.push(p);a++}
  saveRooms();savePeople();renderAll();return `Imported ${a} item(s)`+(bad?`, skipped ${bad} invalid`:'')+'. Items with matching IDs were replaced. Page numbers refer to the combined page order of the loaded PDFs.'}
function openIo(m){ioMode=m;$('#ioMsg').textContent='';const T={exp:'Export configuration (JSON)',imp:'Import rooms and people (JSON or CSV)',bulk:'Add several people'}[m];$('#ioT').textContent=T;
  $('#ioGo').textContent={exp:'Download',imp:'Import',bulk:'Add people'}[m];$('#ioCp').hidden=m!=='exp';$('#ioFL').hidden=m==='exp';
  $('#ioTa').value=m==='exp'?JSON.stringify({version:3,pageNumbering:'1-based, continuous across the PDFs in the order listed under documents',documents:docs.map(d=>({name:d.name,pages:d.n})),rooms,people},null,2):'';
  $('#ioTa').placeholder=m==='imp'?'Paste JSON, or CSV. Rooms: id,name,page,x,y,width,height,notes. People: id,name,role,team,contact,page,x,y':m==='bulk'?'One person per line:\nName, Role, Team\nJane Citizen, Engineer, Network':'';
  if(!$('#io').open)$('#io').showModal()}
$('#ioX').onclick=()=>$('#io').close();
$('#ioF').onchange=async e=>{const f=e.target.files[0];if(f){$('#ioTa').value=await f.text();$('#ioMsg').textContent='File loaded. Press Import.'}e.target.value=''};
$('#ioCp').onclick=async()=>{try{await navigator.clipboard.writeText($('#ioTa').value);$('#ioMsg').textContent='Copied.'}catch(e){$('#ioTa').select();$('#ioMsg').textContent='Select all and copy.'}};
$('#ioGo').onclick=()=>{
  if(ioMode==='imp'){$('#ioMsg').textContent=doImport($('#ioTa').value);return}
  if(ioMode==='bulk'){let n=0;for(const ln of $('#ioTa').value.split('\n')){const[nm,role,team]=ln.split(',').map(s=>s.trim());if(!nm)continue;people.push({id:nextId(people,'P'),name:nm,role:role||'',team:team||'',contact:'',page,x:null,y:null});n++}
    savePeople();renderAll();$('#io').close();toast(n+' people added. Use “Place next unplaced” to position them.');return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ioTa').value],{type:'application/json'}));a.download='andrews-lost.json';a.click();$('#ioMsg').textContent='If no download starts, use Copy and save the text as a .json file.'}catch(e){$('#ioMsg').textContent='Use Copy instead.'}};

/* ---------- Global keys ---------- */
addEventListener('keydown',e=>{
  const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable,m=e.ctrlKey||e.metaKey;
  if(m&&e.key.toLowerCase()==='k'){e.preventDefault();P.open?closePal():openPal();return}
  if(m&&e.key===','){e.preventDefault();openSet();return}
  if(e.key==='/'&&!typing&&!P.open&&!document.querySelector('dialog[open]')){e.preventDefault();openPal();return}
  if(e.key==='Escape'){if(P.open){closePal();return}if(!$('#menu').hidden){closeMenu();return}if(tool){tool=null;chain=false;renderAll()}}});

/* ---------- Init ---------- */
(async()=>{
  await Store.open();rooms=(await Store.get('rooms'))||[];people=(await Store.get('people'))||[];
  pOpen=!narrow();layout();renderAll();
  let list=await Store.get('pdfs');
  if(!list||!list.length){const old=await Store.get('pdf');list=old?[{name:'Floor plan',buf:old}]:[];const migrate=!!old;
    await restoreDocs(list);if(migrate&&docs.length)await saveDocs()}
  else await restoreDocs(list);
  renderAll();
})();
</script>
